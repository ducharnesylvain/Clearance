[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clearance"
version = "0.1.0"
description = "Eval-first AI decision copilot: checks business changes against written rules, cites every claim, escalates when unsure."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
providers = [
  "anthropic>=0.40",
  "openai>=1.50",
  "google-genai>=1.0",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["clearance*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Models under comparison (SPEC section 8, decision D5).
# model_id: the exact API identifier, pinned at the first eval run.
# Prices: USD per million tokens, copied from the vendor's pricing page with the date
# in a comment. Leave null until checked: cost is then reported as "not priced".
# temperature: set to null for models that do not accept it.
models:
